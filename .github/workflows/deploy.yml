name: Deploy

# Publica el panel, reglas de Firestore/Storage e indices a Firebase cada
# vez que se sube codigo a main. Requiere el secreto
# FIREBASE_SERVICE_ACCOUNT_INTELLISHIP en GitHub (Settings -> Secrets and
# variables -> Actions), con el JSON de la cuenta de servicio de Firebase.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: intelliship-prod

jobs:
  deploy:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Build del panel
        run: npm run build
      - name: Publicar en Firebase (Hosting, Firestore, Storage)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELLISHIP }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx firebase-tools@15 deploy --only hosting,firestore,storage --project "$FIREBASE_PROJECT" --non-interactive
          rm -f /tmp/firebase-sa.json
