name: Deploy

# Publica el panel y las reglas de Firestore/Storage/indices a Firebase
# cada vez que se sube codigo a main. Requiere el secreto
# FIREBASE_SERVICE_ACCOUNT_INTELLISHIP en GitHub (Settings -> Secrets and
# variables -> Actions), con el JSON de la cuenta de servicio de Firebase.
#
# 'functions' (automatizaciones de WhatsApp) esta afuera del --only de abajo
# A PROPOSITO por ahora: firebase deploy valida TODOS los targets antes de
# publicar cualquiera, y como esas Cloud Functions usan defineSecret() para
# el token de WhatsApp, el deploy completo (incluyendo Hosting) fallaba
# porque esos secretos todavia no existen en Secret Manager -- ver el
# comentario en functions/index.js para los pasos que faltan (crear las
# plantillas en Meta, regenerar el token, correr `firebase
# functions:secrets:set ...` 4 veces). Una vez hecho eso, se agrega
# ',functions' de nuevo al --only de aca abajo.
#
# Cuando se reactive, ojo: desplegar Cloud Functions (Gen 2) necesita mas
# permisos que solo Hosting/Firestore/Storage -- si falla con un error de
# permisos, la cuenta de servicio necesita los roles "Cloud Functions
# Admin", "Service Account User", "Artifact Registry Administrator" (o
# "Editor") y "Secret Manager Secret Accessor" en IAM > Cuentas de
# servicio, en la consola de Google Cloud del proyecto.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: intelliship-prod

jobs:
  deploy:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Build del panel
        run: npm run build
      - name: Publicar en Firebase (Hosting, Firestore, Storage)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELLISHIP }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx firebase-tools@15 deploy --only hosting,firestore,storage --project "$FIREBASE_PROJECT" --non-interactive
          rm -f /tmp/firebase-sa.json
